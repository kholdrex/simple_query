name: SimpleQuery CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  test_postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: simple_query_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]
        ar-gemfile: ["activerecord7.2", "activerecord8.0", "activerecord8.1"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install dependencies
        run: |
          cp gemfiles/Gemfile.${{ matrix.ar-gemfile }} Gemfile
          bundle install --jobs 4 --retry 3

      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres..."
            sleep 5
          done

      - name: Create test DB (Postgres)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE simple_query_test;" || true
          PGPASSWORD=secret psql -h localhost -U postgres -c "CREATE DATABASE simple_query_secondary_test;"

      - name: Prepare DB env (Postgres)
        run: |
          echo "DB_ADAPTER=postgresql" >> $GITHUB_ENV
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=secret" >> $GITHUB_ENV
          echo "DB_DATABASE=simple_query_test" >> $GITHUB_ENV
          echo "DB_SECONDARY_DATABASE=simple_query_secondary_test" >> $GITHUB_ENV

      - name: Run tests
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

  test_mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: simple_query_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --password=secret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]
        ar-gemfile: ["activerecord7.2", "activerecord8.0", "activerecord8.1"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install dependencies
        run: |
          cp gemfiles/Gemfile.${{ matrix.ar-gemfile }} Gemfile
          bundle install --jobs 4 --retry 3

      - name: Wait for MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          for i in {1..10}; do
            mysqladmin ping -h 127.0.0.1 --password=secret && break
            echo "Waiting for mysql..."
            sleep 5
          done

      - name: Create test DB (MySQL)
        run: |
          mysql -h 127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS simple_query_test"
          mysql -h 127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS simple_query_secondary_test"

      - name: Prepare DB env (MySQL)
        run: |
          echo "DB_ADAPTER=mysql2" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_USER=root" >> $GITHUB_ENV
          echo "DB_PASSWORD=secret" >> $GITHUB_ENV
          echo "DB_DATABASE=simple_query_test" >> $GITHUB_ENV
          echo "DB_SECONDARY_DATABASE=simple_query_secondary_test" >> $GITHUB_ENV

      - name: Run tests
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop
